{% extends 'base.html' %}
{% block content %}
<div class="p-8">
    <h1 class="text-2xl font-bold">Rules</h1>
    <div class="flex justify-between items-center mb-4">
        <form method="get" action="{% url 'rule_search' %}" class="flex">
            <input type="text" name="q" value="{{ query }}" placeholder="Search rules..." class="px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            <button type="submit" class="ml-2 px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">Search</button>
            <a href="{% url 'rule_list' %}" class="ml-2 px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500">Clear</a>
        </form>
        <a href="{% url 'rule_create' %}" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500">Add New Rule</a>
    </div>
    <table class="min-w-full mt-4 bg-white">
        <thead>
            <tr>
                <th class="py-2 px-4 border-b">Name</th>
                <th class="py-2 px-4 border-b">Description</th>
                <th class="py-2 px-4 border-b">Actions</th>
            </tr>
        </thead>
        <tbody>
        {% for rule in rules %}
            <tr class="{% if rule.archived %}bg-red-100{% endif %}">
                <td class="py-2 px-4 border-b">{{ rule.name }}</td>
                <td class="py-2 px-4 border-b">{{ rule.description }}</td>
                <td class="py-2 px-4 border-b">
                    <a href="{% url 'rule_update' rule.pk %}" class="text-blue-600 hover:text-blue-800">Edit</a>
                    {% if rule.archived %}
                        <a href="{% url 'rule_restore' rule.pk %}" class="text-green-600 hover:text-green-800 ml-4">Restore</a>
                    {% else %}
                        <a href="{% url 'rule_delete' rule.pk %}" class="text-red-600 hover:text-red-800 ml-4">Delete</a>
                    {% endif %}
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
